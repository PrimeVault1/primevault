  <style>
    /* Professional Loading Spinner Style */
    #loading { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #0B0F19; }
    .spinner { border: 4px solid #161F30; border-top: 4px solid #00D2FF; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
  </div>

  <script>
    // This removes the spinner as soon as the page is fully loade
    window.addEventListener('load', function(ev) {
      document.getElementById('loading').style.display = 'none';
    });
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
